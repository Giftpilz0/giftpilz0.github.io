---
name: Update Ansible docs

on:
  schedule:
    # Weekly: every Monday at 03:00 UTC.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ansible-docs
  cancel-in-progress: false

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install PyYAML
        run: python3 -m pip install pyyaml

      - name: Generate ansible container docs
        run: python3 scripts/generate_ansible_docs.py

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain docs/projects/ansible/container/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push updated docs
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/projects/ansible/container
          git commit -m "docs: regenerate ansible container role docs"
          git push
